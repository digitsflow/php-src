name: Security & Sanitizer Quality Gate (ASAN / UBSAN)

on:
  pull_request:
    branches:
      - 'digitsflow-*'
      - master
      - 'PHP-*'
  push:
    branches:
      - 'digitsflow-*'
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.url || github.run_id }}
  cancel-in-progress: true

jobs:
  asan-ubsan-gate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    name: AddressSanitizer & UndefinedBehaviorSanitizer Gate (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Install System Dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/*pgdg* /etc/apt/sources.list.d/*postgresql* || true
          sudo apt-get update
          sudo apt-get install -y --allow-downgrades gcc g++ ccache make autoconf bison re2c pkg-config \
            libxml2-dev libxslt1-dev libssl-dev libsqlite3-dev libpq-dev zlib1g-dev libcurl4-openssl-dev \
            libonig-dev libzip-dev libsystemd-dev libicu-dev libffi-dev

      - name: Configure Compiler Cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: "asan-ubsan-gate-${{ matrix.arch }}-${{ github.ref_name }}"
          append-timestamp: false
          save: true

      - name: Generate Configure Script
        run: ./buildconf --force

      - name: Configure with ASAN & UBSAN
        env:
          CC: "ccache gcc"
          CXX: "ccache g++"
          CFLAGS: "-fsanitize=address,undefined -fno-omit-frame-pointer -g -O1 -DZEND_TRACK_ARENA_ALLOC -Wno-deprecated-declarations"
          LDFLAGS: "-fsanitize=address,undefined"
        run: |
          ./configure \
            --enable-debug \
            --disable-all \
            --enable-cli \
            --enable-fpm \
            --enable-litespeed \
            --enable-opcache \
            --enable-phar \
            --enable-session \
            --enable-xml \
            --enable-simplexml \
            --enable-dom \
            --with-libxml \
            --enable-mbstring \
            --with-curl \
            --with-zip \
            --enable-exif \
            --enable-soap \
            --enable-ftp \
            --enable-pcntl \
            --enable-posix \
            --enable-sockets \
            --enable-pdo \
            --with-pdo-sqlite \
            --with-pdo-pgsql \
            --with-pgsql \
            --with-ffi \
            --with-mhash \
            --with-xsl \
            --with-openssl \
            --with-zlib

      - name: Compile PHP
        run: make -j$(nproc)

      - name: Execute Security & Regression Tests under ASAN (${{ matrix.arch }})
        env:
          SKIP_ASAN: "1"
          ASAN_OPTIONS: "detect_leaks=1:abort_on_error=1:allocator_may_return_null=1"
          UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
        run: |
          TESTS=""
          for t in \
            Zend/tests/gh21776.phpt \
            Zend/tests/gh24989.phpt \
            ext/exif/tests/gh23807.phpt \
            ext/ffi/tests/finalize_type_bailout_leak.phpt \
            ext/ffi/tests/spprintf_ps_null_and_zeropad.phpt \
            ext/hash/tests/gh23950.phpt \
            ext/json/tests/json_encode_invalid_key_aborts.phpt \
            ext/json/tests/json_encode_nan_abort.phpt \
            ext/opcache/tests/jit/aarch64_ir_patch_and_veneer_safety.phpt \
            ext/opcache/tests/jit/assign_obj_may_throw_hooks_static_lazy.phpt \
            ext/opcache/tests/jit/gh24436.phpt \
            ext/pdo/tests/pdo_fetch_both_column_count_overflow.phpt \
            ext/pdo_pgsql/tests/libpq_symbol_portability.phpt \
            ext/phar/tests/tar/gh24740.phpt \
            ext/session/tests/gh24376_session_cloexec.phpt \
            ext/session/tests/mod_user_create_sid_null.phpt \
            ext/session/tests/session_id_nul_byte.phpt \
            ext/soap/tests/gh23771.phpt \
            ext/soap/tests/gh23771_invalid.phpt \
            ext/soap/tests/gh23771_valid.phpt \
            ext/spl/tests/spl_file_info_get_link_target_uninit.phpt \
            ext/standard/tests/http/http_response_header_nested_request.phpt \
            ext/standard/tests/network/gh24616.phpt \
            ext/standard/tests/network/network_addr_nul_and_bindto_leak.phpt \
            ext/standard/tests/serialize/__unserialize_malformed_nested_destructor.phpt \
            ext/standard/tests/strings/gh23204_frameless.phpt \
            ext/standard/tests/strings/metaphone_lookahead_overflow.phpt \
            ext/xsl/tests/gh23199_destruct.phpt \
            ext/zip/tests/gh23240_cleanup.phpt \
            ext/zlib/tests/zlib_filter_inflate_error_handler_removes_filter.phpt \
            sapi/fpm/tests/zlog_errno_stack_overflow.phpt \
            sapi/litespeed/tests/lsapi_security_hardening.phpt; do
            if [ -f "$t" ]; then
              TESTS="$TESTS $t"
            fi
          done
          if [ -n "$TESTS" ]; then
            echo "Running Digitsflow Security & Sanitizer Regression Suite under ASAN (${{ matrix.arch }}):"
            echo "$TESTS"
            sapi/cli/php run-tests.php -P -q --show-diff -d extension_dir=$PWD/modules $TESTS
          fi
