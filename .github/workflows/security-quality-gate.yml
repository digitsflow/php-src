name: Security & Sanitizer Quality Gate (ASAN / UBSAN)

on:
  push:
    branches:
      - 'digitsflow-*'
      - master
  pull_request:
    branches:
      - 'digitsflow-*'
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  asan-verification:
    name: AddressSanitizer & UndefinedBehaviorSanitizer Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ ccache make autoconf bison re2c pkg-config \
            libxml2-dev libssl-dev libsqlite3-dev zlib1g-dev libcurl4-openssl-dev \
            libonig-dev libzip-dev libsystemd-dev libicu-dev

      - name: Configure Compiler Cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: "security-gate-asan-x86_64"
          append-timestamp: false
          save: true

      - name: Regenerate Build System
        run: ./buildconf --force

      - name: Configure with ASAN & UBSAN
        env:
          CC: "ccache gcc"
          CXX: "ccache g++"
          CFLAGS: "-fsanitize=address,undefined -fno-omit-frame-pointer -g -O1 -DZEND_TRACK_ARENA_ALLOC -Wno-deprecated-declarations"
          LDFLAGS: "-fsanitize=address,undefined"
        run: |
          ./configure \
            --enable-debug \
            --disable-all \
            --enable-cli \
            --with-libxml \
            --enable-session \
            --enable-xml \
            --with-curl \
            --with-zip \
            --with-gettext \
            --enable-exif \
            --enable-soap \
            --enable-mbstring \
            --enable-simplexml \
            --enable-dom \
            --enable-opcache \
            --enable-ftp \
            --enable-pcntl \
            --enable-posix \
            --enable-sockets \
            --with-openssl \
            --with-zlib

      - name: Compile Sanitized PHP Binary
        run: make -j$(nproc)

      - name: Execute Security & Regression Tests under ASAN
        env:
          ASAN_OPTIONS: "detect_leaks=1:abort_on_error=1:allocator_may_return_null=1"
          UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
        run: |
          CHANGED_TESTS=$(git diff --name-only HEAD~1 HEAD | grep '\.phpt$' || true)
          if [ -n "$CHANGED_TESTS" ]; then
            echo "Running PR regression test suite under ASAN:"
            echo "$CHANGED_TESTS"
            sapi/cli/php run-tests.php -P -q --show-diff -d extension_dir=$PWD/modules $CHANGED_TESTS
          else
            TESTS=""
            for t in \
              ext/zip/tests/gh23240_cleanup.phpt \
              ext/session/tests/mod_user_create_sid_null.phpt \
              ext/standard/tests/strings/gh23204_frameless.phpt \
              ext/zlib/tests/zlib_filter_inflate_error_handler_removes_filter.phpt \
              ext/standard/tests/strings/metaphone_lookahead_overflow.phpt \
              ext/session/tests/gh24376_session_cloexec.phpt; do
              if [ -f "$t" ]; then
                TESTS="$TESTS $t"
              fi
            done
            if [ -n "$TESTS" ]; then
              sapi/cli/php run-tests.php -P -q --show-diff -d extension_dir=$PWD/modules $TESTS
            fi
          fi
