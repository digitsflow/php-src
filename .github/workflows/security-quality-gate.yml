name: Security & Sanitizer Quality Gate (ASAN / UBSAN)

on:
  push:
    branches:
      - 'digitsflow-*'
      - master
  pull_request:
    branches:
      - 'digitsflow-*'
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  asan-verification:
    name: AddressSanitizer & UndefinedBehaviorSanitizer Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ ccache make autoconf bison re2c pkg-config \
            libxml2-dev libxslt1-dev libssl-dev libsqlite3-dev zlib1g-dev libcurl4-openssl-dev \
            libonig-dev libzip-dev libsystemd-dev libicu-dev libffi-dev

      - name: Configure Compiler Cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: "security-gate-asan-x86_64"
          append-timestamp: false
          save: true

      - name: Regenerate Build System
        run: ./buildconf --force

      - name: Configure with ASAN & UBSAN
        env:
          CC: "ccache gcc"
          CXX: "ccache g++"
          CFLAGS: "-fsanitize=address,undefined -fno-omit-frame-pointer -g -O1 -DZEND_TRACK_ARENA_ALLOC -Wno-deprecated-declarations"
          LDFLAGS: "-fsanitize=address,undefined"
        run: |
          ./configure \
            --enable-debug \
            --disable-all \
            --enable-cli \
            --with-libxml \
            --enable-session \
            --enable-xml \
            --with-curl \
            --with-zip \
            --with-gettext \
            --enable-exif \
            --enable-soap \
            --enable-mbstring \
            --enable-simplexml \
            --enable-dom \
            --enable-opcache \
            --enable-ftp \
            --enable-pcntl \
            --enable-posix \
            --enable-sockets \
            --enable-pdo \
            --with-pdo-sqlite \
            --with-ffi \
            --with-mhash \
            --with-xsl \
            --with-openssl \
            --with-zlib

      - name: Compile Sanitized PHP Binary
        run: make -j$(nproc)

      - name: Execute Security & Regression Tests under ASAN
        env:
          ASAN_OPTIONS: "detect_leaks=1:abort_on_error=1:allocator_may_return_null=1"
          UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
        run: |
          CHANGED_TESTS=$(git diff --name-only --diff-filter=ACMR HEAD~1 HEAD | grep '\.phpt$' || true)
          CHANGED_COUNT=$(printf "%s\n" "$CHANGED_TESTS" | sed '/^$/d' | wc -l | tr -d ' ')
          if [ "${{ github.event_name }}" = "pull_request" ] && [ -n "$CHANGED_TESTS" ] && [ "$CHANGED_COUNT" -le 25 ]; then
            echo "Running PR regression test suite under ASAN ($CHANGED_COUNT tests):"
            echo "$CHANGED_TESTS"
            sapi/cli/php run-tests.php -P -q --show-diff -d extension_dir=$PWD/modules $CHANGED_TESTS
          else
            TESTS=""
            for t in \
              Zend/tests/gh21776.phpt \
              ext/exif/tests/gh23807.phpt \
              ext/ffi/tests/finalize_type_bailout_leak.phpt \
              ext/ffi/tests/spprintf_ps_null_and_zeropad.phpt \
              ext/hash/tests/gh23950.phpt \
              ext/pdo/tests/pdo_fetch_both_column_count_overflow.phpt \
              ext/session/tests/gh24376_session_cloexec.phpt \
              ext/session/tests/mod_user_create_sid_null.phpt \
              ext/soap/tests/gh23771.phpt \
              ext/soap/tests/gh23771_invalid.phpt \
              ext/soap/tests/gh23771_valid.phpt \
              ext/spl/tests/spl_file_info_get_link_target_uninit.phpt \
              ext/standard/tests/http/http_response_header_nested_request.phpt \
              ext/standard/tests/strings/gh23204_frameless.phpt \
              ext/standard/tests/strings/metaphone_lookahead_overflow.phpt \
              ext/xsl/tests/gh23199_destruct.phpt \
              ext/zip/tests/gh23240_cleanup.phpt \
              ext/zlib/tests/zlib_filter_inflate_error_handler_removes_filter.phpt; do
              if [ -f "$t" ]; then
                TESTS="$TESTS $t"
              fi
            done
            if [ -n "$TESTS" ]; then
              echo "Running Digitsflow Security & Sanitizer Regression Suite under ASAN:"
              echo "$TESTS"
              sapi/cli/php run-tests.php -P -q --show-diff -d extension_dir=$PWD/modules $TESTS
            fi
          fi
