name: Build & Release Digitsflow PHP

on:
  push:
    branches:
      - 'digitsflow-*'
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - 'digitsflow-*'
      - master
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    name: Build & Package PHP (Ubuntu 24.04 ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ccache autoconf bison re2c pkg-config \
            libxml2-dev libssl-dev libzip-dev libpq-dev \
            libcurl4-openssl-dev libonig-dev libsqlite3-dev zlib1g-dev \
            libsystemd-dev libicu-dev

      - name: Configure Compiler Cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: "build-digitsflow-${{ matrix.arch }}"
          append-timestamp: false
          save: true

      - name: Build & Stage Digitsflow PHP (${{ matrix.arch }})
        env:
          CC: "ccache gcc"
          CXX: "ccache g++"
          CFLAGS: "-O2 -Wno-deprecated-declarations"
        run: |
          chmod +x packaging/scripts/build-digitsflow.sh
          INSTALL_ROOT=/tmp/digitsflow-pkg ./packaging/scripts/build-digitsflow.sh

      - name: Run Core Regression Tests
        run: |
          ./sapi/cli/php -v
          TESTS=""
          for t in \
            ext/zip/tests/gh23240_cleanup.phpt \
            ext/session/tests/mod_user_create_sid_null.phpt \
            ext/standard/tests/strings/gh23204_frameless.phpt \
            ext/xsl/tests/gh23199_destruct.phpt \
            ext/zlib/tests/zlib_filter_inflate_error_handler_removes_filter.phpt \
            ext/standard/tests/strings/metaphone_lookahead_overflow.phpt \
            ext/session/tests/gh24376_session_cloexec.phpt \
            ext/opcache/tests/jit/aarch64_ir_patch_and_veneer_safety.phpt; do
            if [ -f "$t" ]; then
              TESTS="$TESTS $t"
            fi
          done
          if [ -n "$TESTS" ]; then
            ./sapi/cli/php run-tests.php -p ./sapi/cli/php $TESTS
          fi

      - name: Create Distribution Tarball
        run: |
          REF_CLEAN=$(echo "${{ github.ref_name }}" | tr '/' '-')
          PKG_NAME="php-digitsflow-${REF_CLEAN}-linux-${{ matrix.arch }}.tar.gz"
          tar -czvf "$PKG_NAME" -C /tmp/digitsflow-pkg .
          echo "PKG_NAME=$PKG_NAME" >> "$GITHUB_ENV"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: php-digitsflow-${{ matrix.arch }}
          path: ${{ env.PKG_NAME }}
          retention-days: 14

      - name: Publish Release (on Tag)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
              gh release create "$TAG_NAME" --generate-notes --title "Digitsflow PHP $TAG_NAME" || true
            fi
            gh release upload "$TAG_NAME" "$PKG_NAME" --clobber
          else
            echo "Verified package artifact ${PKG_NAME} (${{ matrix.arch }}) for ref ${GITHUB_REF}."
          fi

  build-docker:
    name: Build & Push Multi-Arch Docker Image (x86_64 & aarch64)
    needs: build-and-test
    runs-on: ubuntu-24.04
    steps:
      - name: Download Staged Package Artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/artifacts

      - name: Prepare Multi-Arch Runtime Docker Context
        run: |
          mkdir -p /tmp/docker-ctx/pkg-root-amd64 /tmp/docker-ctx/pkg-root-arm64
          TARBALL_X64=$(find /tmp/artifacts -type f -name "php-digitsflow-*-linux-x86_64.tar.gz" | head -n 1)
          TARBALL_ARM64=$(find /tmp/artifacts -type f -name "php-digitsflow-*-linux-aarch64.tar.gz" | head -n 1)
          tar -xzf "$TARBALL_X64" -C /tmp/docker-ctx/pkg-root-amd64
          tar -xzf "$TARBALL_ARM64" -C /tmp/docker-ctx/pkg-root-arm64
          cat > /tmp/docker-ctx/Dockerfile <<'EOF'
          FROM ubuntu:24.04
          ARG TARGETARCH
          ENV DEBIAN_FRONTEND=noninteractive
          ENV PATH="/opt/digitsflow/php/bin:/opt/digitsflow/php/sbin:${PATH}"
          RUN apt-get update && apt-get install -y --no-install-recommends \
              ca-certificates libxml2 libssl3t64 libzip4t64 libpq5 libcurl4t64 \
              libonig5 libsqlite3-0 zlib1g libsystemd0 libicu74 \
              && rm -rf /var/lib/apt/lists/*
          COPY pkg-root-${TARGETARCH}/opt/digitsflow/php /opt/digitsflow/php
          COPY pkg-root-${TARGETARCH}/etc/digitsflow/php /etc/digitsflow/php
          RUN ln -sf /opt/digitsflow/php/bin/php-digitsflow /usr/local/bin/php && \
              ln -sf /opt/digitsflow/php/sbin/php-fpm-digitsflow /usr/local/bin/php-fpm && \
              mkdir -p /run/digitsflow && chown www-data:www-data /run/digitsflow
          WORKDIR /var/www/html
          EXPOSE 9000
          CMD ["php-fpm-digitsflow", "--nodaemonize", "--fpm-config", "/etc/digitsflow/php/php-fpm.conf"]
          EOF

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/digitsflow-8.4' }}

      - name: Build and Push Multi-Arch Docker image
        uses: docker/build-push-action@v5
        with:
          context: /tmp/docker-ctx
          file: /tmp/docker-ctx/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
