name: Build & Release Digitsflow PHP

on:
  push:
    branches:
      - 'digitsflow-*'
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - 'digitsflow-*'
      - master
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-test:
    name: Build & Package PHP (Ubuntu 24.04 x86_64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf bison re2c pkg-config \
            libxml2-dev libssl-dev libzip-dev libpq-dev \
            libcurl4-openssl-dev libonig-dev libsqlite3-dev zlib1g-dev \
            libsystemd-dev libicu-dev

      - name: Build & Stage Digitsflow PHP
        run: |
          chmod +x packaging/scripts/build-digitsflow.sh
          INSTALL_ROOT=/tmp/digitsflow-pkg ./packaging/scripts/build-digitsflow.sh

      - name: Run Core Regression Tests
        run: |
          ./sapi/cli/php -v
          TESTS=""
          for t in \
            ext/zip/tests/gh23240_cleanup.phpt \
            ext/session/tests/mod_user_create_sid_null.phpt \
            ext/standard/tests/strings/gh23204_frameless.phpt \
            ext/xsl/tests/gh23199_destruct.phpt \
            ext/zlib/tests/zlib_filter_inflate_error_handler_removes_filter.phpt \
            ext/standard/tests/strings/metaphone_lookahead_overflow.phpt \
            ext/session/tests/gh24376_session_cloexec.phpt; do
            if [ -f "$t" ]; then
              TESTS="$TESTS $t"
            fi
          done
          if [ -n "$TESTS" ]; then
            ./sapi/cli/php run-tests.php -p ./sapi/cli/php $TESTS
          fi

      - name: Create Distribution Tarball
        run: |
          REF_CLEAN=$(echo "${{ github.ref_name }}" | tr '/' '-')
          PKG_NAME="php-digitsflow-${REF_CLEAN}-linux-x86_64.tar.gz"
          tar -czvf "$PKG_NAME" -C /tmp/digitsflow-pkg .
          echo "PKG_NAME=$PKG_NAME" >> "$GITHUB_ENV"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG_NAME }}
          path: ${{ env.PKG_NAME }}
          retention-days: 14

      - name: Publish Release (on Tag)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            if gh release view "$TAG_NAME" >/dev/null 2>&1; then
              gh release upload "$TAG_NAME" "$PKG_NAME" --clobber
            else
              gh release create "$TAG_NAME" "$PKG_NAME" --generate-notes --title "Digitsflow PHP $TAG_NAME"
            fi
          else
            echo "Verified package artifact ${PKG_NAME} for ref ${GITHUB_REF}."
          fi

  build-docker:
    name: Build & Push Docker Image
    needs: build-and-test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/digitsflow-8.4' }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.digitsflow
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
